trigger:
  branches:
    include:
    - main

pr: none

pool:
  vmImage: ubuntu-latest

variables:
- group: azure-kusto-fluentd-e2e

jobs:
- job: E2E
  displayName: Run authenticated Kusto E2E tests
  timeoutInMinutes: 30
  condition: |
    and(
      succeeded(),
      or(
        eq(variables['Build.SourceBranch'], 'refs/heads/main'),
        eq(variables['Build.Reason'], 'Manual')
      )
    )
  steps:
  - checkout: self
    clean: true

  - task: UseRubyVersion@0
    displayName: Use Ruby 3.2
    inputs:
      versionSpec: '3.2'
      addToPath: true

  - bash: |
      bundle config set --local frozen false
      bundle config set --local deployment false
      bundle install
    displayName: Install dependencies

  - task: AzureCLI@2
    displayName: Run Kusto E2E tests
    timeoutInMinutes: 15
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: bundle exec rake test TEST="test/plugin/test_e2e_kusto.rb"
    env:
      AUTH_TYPE: azcli
      CLUSTER: $(CLUSTER)
      DB: $(DB)
