name: CI Build

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    name: Build and test Fluentd plugin
    runs-on: ubuntu-latest
    environment: build
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: '3.2.6'
          bundler-cache: true
          cache-version: 1

      - name: Configure bundler
        run: |
          bundle config set --local frozen false
          bundle config set --local deployment false

      - name: Install dependencies
        run: bundle install

      - name: Run unit tests
        run: bundle exec rake test TEST="test/plugin/test_out_kusto_*.rb"
        timeout-minutes: 10
        env:
          JUNIT_XML_OUTPUT: test-results.xml

      - name: Build gem
        run: gem build fluent-plugin-kusto.gemspec

      - name: Install Fluentd
        run: gem install fluentd -v ">= 1.19.3, < 2"

      - name: Install plugin
        run: gem install fluent-plugin-kusto-*.gem

      - name: Publish unit test results
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
        if: always()
        with:
          files: |
            **/test-results.xml
            **/rspec.xml
            **/TEST-*.xml
