name: Deploy and Create Release
on:
  workflow_dispatch:
  release:
    types: [released]
jobs:
  build:
    permissions:
      contents: read
      checks: write
      pull-requests: write
      id-token: write
      packages: write
    name: Upload Release Asset
    runs-on: ubuntu-latest
    environment: build
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.2.6'
          bundler-cache: true

      - name: Build gem
        run: gem build fluent-plugin-kusto.gemspec
        working-directory: .

      - name: Publish gem to RubyGems
        uses: dawidd6/action-publish-gem@c4713bf1595e0686322d6cf6c1a1c0dcaeca55de # v1.2.0
        with:
          api_key: ${{ secrets.RUBYGEMS_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set artifact name
        id: set_artifact_name
        run: |
          ARTIFACT_PATH=$(find . -maxdepth 1 -iname 'fluent-plugin-kusto-*.gem')
          echo "artifact_name=$ARTIFACT_PATH" >> $GITHUB_OUTPUT
        working-directory: .
